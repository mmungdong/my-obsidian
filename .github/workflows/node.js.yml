name: Build & Deploy Hexo

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REPO_DIR: repo  # 仓库克隆到的基础目录
      BLOG_DIR: repo/Blog  # 直接拼接路径，不使用env引用
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_OBSIDIAN_TOKEN }}
          repository: 'mmungdong/my-obsidian'
          path: ${{ env.REPO_DIR }}  # 这里可以正常使用env引用

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ${{ env.BLOG_DIR }}/package-lock.json

      - name: Configure Git credentials
        run: |
          # 全局配置Git使用凭证助手
          git config --global credential.helper store
          # 保存凭据（避免重复输入）
          echo "https://x-access-token:${{ secrets.MMUNGDONG_GITHUB_IO_PUSH }}@github.com" > ~/.git-credentials

      - name: Install deps & build
        run: |
          git config --global user.name 'my-obsidian actions'
          git config --global user.email 'github@action.com'
          cd ${{ env.BLOG_DIR }}
          
          # 验证远程仓库配置
          git remote add pages https://github.com/mmungdong/mmungdong.github.io.git
          git remote -v  # 这行会在日志中显示远程仓库配置，方便调试
          
          npm install
          npx hexo clean
          npx hexo generate
          npx hexo deploy  # 部署时会自动使用保存的凭据
        env:
          HEXO_DEPLOY_TOKEN: ${{ secrets.MMUNGDONG_GITHUB_IO_PUSH }}


