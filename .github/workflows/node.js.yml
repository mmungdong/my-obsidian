name: Build & Deploy Hexo

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REPO_DIR: repo  # 仓库克隆到的基础目录
      BLOG_DIR: ${{ env.REPO_DIR }}/Blog  # 仓库内的Blog目录
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_OBSIDIAN_TOKEN }}
          repository: 'mmungdong/my-obsidian'
          path: ${{ env.REPO_DIR }}  # 克隆到repo目录

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          # 关键：指定锁文件在Blog目录（支持通配符匹配多种锁文件）
          # cache-dependency-path: ${{ env.BLOG_DIR }}/**/{package-lock.json,yarn.lock}

      - name: Install deps & build
        run: |
          git config --global user.name 'my-obsidian actions'
          git config --global user.email 'github@action.com'
          # 切换到Blog目录（双重保障，虽然working-directory已指定）
          cd ${{ env.BLOG_DIR }}
          # 添加部署仓库远程地址（注意：这里需要在Blog目录下操作git）
          git remote add pages https://x-access-token:${{ secrets.MMUNGDONG_GITHUB_IO_PUSH }}@github.com/mmungdong/mmungdong.github.io.git
          # 安装依赖（如果有锁文件用ci，没有用install）
          if [ -f "package-lock.json" ] || [ -f "yarn.lock" ]; then
            npm ci
          else
            npm install
          fi
          npx hexo clean
          npx hexo generate
          npx hexo deploy
        # working-directory: ${{ env.BLOG_DIR }}  # 明确在Blog目录执行
        env:
          HEXO_DEPLOY_TOKEN: ${{ secrets.MMUNGDONG_GITHUB_IO_PUSH }}
