# Site
title: Yang Fanbin
subtitle: Yang Fanbin's blog
description: ''
keywords:
author: Yang Fanbin
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
url: https://yangfanbin.cn/
permalink: :title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 0 # 禁用分页，显示所有文章
  order_by: -date

# Category & Tag
default_category: 待归档
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 0 # 禁用分页
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: fluid

# Deployment
deploy:
  type: git
  repo: https://github.com/mmungdong/mmungdong.github.io.git
  branch: master
  token: [token]

# Generate categories from directory-tree
auto_category:
  enable: true
  depth: 1